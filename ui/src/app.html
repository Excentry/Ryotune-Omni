<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				try {
					const saved = JSON.parse(localStorage.getItem('ryotunes:appearance') || '{}');
					const pref = ['light', 'dark', 'system'].includes(saved.themeMode) ? saved.themeMode : 'system';
					const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.ryoTheme = dark ? 'dark' : 'light';
					document.documentElement.dataset.themePreference = pref;
					document.documentElement.classList.toggle('dark', dark);
				} catch {}
			})();
		</script>
		<style>
			html[data-ryo-theme="dark"],html[data-ryo-theme="dark"] body{background:#080807;color:#d8d0c7}
			html[data-ryo-theme="light"],html[data-ryo-theme="light"] body{background:#b8b1a7;color:#25211d}
			#ryotunes-boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:inherit;color:inherit;pointer-events:none}
			#ryotunes-boot>div{display:flex;align-items:center;gap:10px;font:600 10px/1 monospace;letter-spacing:.22em;opacity:.72}
			#ryotunes-boot i{display:block;width:18px;height:1px;background:currentColor;opacity:.65}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="ryotunes-boot" aria-hidden="true"><div><i></i><span>力 RYOTUNES OMNI</span></div></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
