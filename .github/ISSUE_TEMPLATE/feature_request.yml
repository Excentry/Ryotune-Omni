name: Feature request
description: Propose an improvement for Ryotune-Omni
title: "[Request] "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: What problem would this solve?
      description: Start with the user problem rather than the implementation.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - Windows
        - Android
        - Linux reference
        - Cross-platform
        - Other
    validations:
      required: true
  - type: dropdown
    id: windows_environment
    attributes:
      label: Is Windows access required to complete or validate this work?
      description: Choose Yes only when a Windows build, runtime, or device is necessary. A Windows target alone does not mean Windows access is required.
      options:
        - No — code, documentation, or audit can proceed without Windows
        - Yes — Windows build, runtime, or device is required
        - Unsure — needs triage
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behaviour
      description: Explain how you would expect it to work in Ryotune-Omni.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mockups, comparable behaviour in another app, or constraints that matter.
