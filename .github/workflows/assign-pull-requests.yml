name: Assign pull requests

on:
  pull_request_target:
    types: [opened]

permissions:
  issues: write

jobs:
  assign:
    name: Assign to the other maintainer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ASSIGN_TO = {
              excentry: 'IsaVonxz-type',
              'isavonxz-type': 'Excentry',
            };
            const opener = context.payload.pull_request.user.login;
            const assignee = ASSIGN_TO[opener.toLowerCase()];
            if (!assignee) {
              core.info(`No assignment rule for opener ${opener}; leaving unassigned.`);
              return;
            }
            if (context.payload.pull_request.assignees.length > 0) {
              core.info('Pull request already has an assignee; leaving it as is.');
              return;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [assignee],
            });
            core.info(`Pull request opened by ${opener} assigned to ${assignee}.`);
