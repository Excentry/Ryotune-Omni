name: Assign issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  assign:
    name: Assign by platform ownership
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ownerFile = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/issue-owners.json',
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(ownerFile.data) || !ownerFile.data.content) {
              throw new Error('Issue-owner config is missing or not a file.');
            }
            const ownerPolicy = JSON.parse(Buffer.from(ownerFile.data.content, 'base64').toString('utf8'));
            if (!ownerPolicy.label_owners || !Array.isArray(ownerPolicy.default_assignees)) {
              throw new Error('Issue-owner config must define label_owners and default_assignees.');
            }
            const issue = context.payload.issue;
            const labelNames = new Set(issue.labels.map(label => typeof label === 'string' ? label : label.name));
            const labelsToAdd = new Set();
            const hasLabelPrefix = prefix => [...labelNames].some(label => label.startsWith(prefix));

            if (!hasLabelPrefix('status:')) labelsToAdd.add('status: needs-triage');
            if (!hasLabelPrefix('type:')) {
              const prefix = issue.title.match(/^\[(bug|request)\]/i)?.[1]?.toLowerCase();
              if (prefix === 'bug') labelsToAdd.add('type: bug');
              if (prefix === 'request') labelsToAdd.add('type: feature');
            }

            const lines = (issue.body || '').split(/\r?\n/);
            const heading = lines.findIndex(line => line.trim().toLowerCase() === '### target platform');
            let platform = '';
            for (let i = heading + 1; heading >= 0 && i < lines.length; i++) {
              platform = lines[i].trim();
              if (platform) break;
            }
            const platformLabels = {
              'Windows': ['platform: windows'],
              'Android': ['platform: android'],
              'Linux reference': ['platform: linux-reference'],
              'Cross-platform': ['platform: windows', 'platform: android'],
            };
            for (const label of platformLabels[platform] || []) {
              if (!labelNames.has(label)) labelsToAdd.add(label);
            }

            const windowsRequirementHeading = lines.findIndex(line =>
              /^### (is windows access required to complete or validate this work|is windows access required to reproduce or verify this bug)\??$/i.test(line.trim())
            );
            let windowsRequirement = '';
            for (let i = windowsRequirementHeading + 1; windowsRequirementHeading >= 0 && i < lines.length; i++) {
              windowsRequirement = lines[i].trim();
              if (windowsRequirement) break;
            }
            if (windowsRequirement.startsWith('Yes —')) labelsToAdd.add('needs: windows');

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              }
            };
            await ensureLabel('needs: windows', '1d76db', 'Completion requires a Windows build, runtime, or device.');
            await ensureLabel('assignment: split', '5319e7', 'Work is independently actionable and intentionally shared between maintainers.');

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [...labelsToAdd],
              });
              core.info(`Added labels: ${[...labelsToAdd].join(', ')}`);
            }

            const effectiveLabels = new Set([...labelNames, ...labelsToAdd]);
            const selectedOwners = new Set();
            for (const label of effectiveLabels) {
              for (const owner of ownerPolicy.label_owners[label] || []) selectedOwners.add(owner);
            }
            const assignees = selectedOwners.size > 0
              ? [...selectedOwners]
              : ownerPolicy.default_assignees;
            if (assignees.length === 0) {
              core.info('No assignment rule matched; leaving unassigned.');
            } else if (issue.assignees.length > 0) {
              core.info('Issue already has an assignee; leaving it as is.');
            } else {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees,
              });
              core.info(`Issue assigned by work requirements to ${assignees.join(', ')}.`);
            }
