name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Frontend type checks
        working-directory: ui
        run: pnpm check

      - name: Frontend build
        working-directory: ui
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Portable Rust crate tests
        run: cargo test --locked -p innertube -p listen-protocol -p ryotunes-protocol -p ryotunes-soundcloud -p ryotunes-tidal -p sync-server
